name: finance_app
description: "Aplicación de control de finanzas personales"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # Base de datos - Drift (ORM)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Utilidades
  intl: ^0.20.1
  uuid: ^4.5.1
  fl_chart: ^1.2.0
  csv: ^8.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code generation para Drift
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true